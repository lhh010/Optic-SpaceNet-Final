<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上板检查 · 四项放行判据</title>
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/tailwind.play.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink: "#05070f", panel: "#0b1120", edge: "#1e293b",
              photon: "#22d3ee", gold: "#fbbf24", elec: "#64748b" },
  } } };
</script>
<style type="text/tailwindcss">
  .card { @apply bg-panel border border-edge rounded-xl p-4; }
  .btn  { @apply rounded-lg px-3 py-2 text-sm font-bold transition cursor-pointer; }
</style>
<style>
  body { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .glow-photon { text-shadow: 0 0 12px rgba(34, 211, 238, .55); }
  .ck-pass  { color: #34d399; border-color: rgba(52, 211, 153, .5); background: rgba(52,211,153,.08); }
  .ck-fail  { color: #f87171; border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.08); }
  .ck-run   { color: #fbbf24; border-color: rgba(251,191,36,.5); background: rgba(251,191,36,.08); }
  .bar-pass { background: linear-gradient(90deg, #059669, #34d399); }
  .bar-fail { background: linear-gradient(90deg, #b91c1c, #f87171); }
</style>
</head>
<body class="bg-ink text-slate-200 font-mono min-w-[900px]">

<header class="fixed top-0 left-0 right-0 z-40 px-5 py-2 flex items-center gap-3
               bg-ink/85 backdrop-blur border-b border-edge/50">
  <span class="text-sm font-bold text-photon glow-photon">⚡ 上板检查 · 四项放行判据</span>
  <a href="/" class="text-xs text-slate-400 hover:text-photon ml-auto">← 返回演示</a>
</header>

<main class="max-w-[960px] mx-auto px-6 pt-16 pb-10">
  <div class="text-slate-400 text-xs mb-4">
    依据 SOP (global/AGENTS.md): <b class="text-slate-200">四项全部达标</b>才开窗。
    开窗前先: <code class="text-photon">who / ps | grep -i gazelle</code> 侦测他队占用 +
    读板上台账 BOARD_USAGE.md 尾部; fresh compass_cali 后判据背靠背执行;
    calib json 同窗口 20 分钟内使用 (stale −12.5pt)。
  </div>

  <div class="card mb-4">
    <div class="flex items-end gap-4 flex-wrap">
      <div>
        <div class="text-xs text-slate-400 mb-1">验证模型 (mini-run)</div>
        <select id="ck-model" class="bg-panel border border-edge rounded-lg text-xs px-2 py-2">
          <option value="model10">M10 · ds3pool3</option>
          <option value="model9">M9 · w075ds3</option>
          <option value="model3">Model 3 · SpaceNet V2+KD</option>
        </select>
      </div>
      <div>
        <div class="text-xs text-slate-400 mb-1">① EBR (evb_test 读数)</div>
        <input id="ck-ebr" type="number" step="0.001" placeholder="≥ 8"
               class="bg-panel border border-edge rounded-lg text-xs px-2 py-2 w-24">
      </div>
      <div>
        <div class="text-xs text-slate-400 mb-1">② error_std (evb 读数, 可留空)</div>
        <input id="ck-std" type="number" step="0.01" placeholder="基线 ~4.7"
               class="bg-panel border border-edge rounded-lg text-xs px-2 py-2 w-28">
      </div>
      <button id="ck-run" class="btn bg-photon text-ink hover:opacity-80">一键检查</button>
      <span id="ck-status" class="text-xs text-slate-500"></span>
    </div>
  </div>

  <div id="ck-list" class="flex flex-col gap-3">
    <div class="card text-sm text-slate-500">点击「一键检查」运行四项判据…</div>
  </div>

  <div id="ck-sop" class="hidden card mt-4 text-xs text-slate-400"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
async function j(r) {
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  return r.json();
}
function badge(pass, value) {
  const cls = pass ? "ck-pass" : "ck-fail";
  return `<span class="border rounded-full px-2 py-0.5 text-[10px] ${cls}">${pass ? "PASS" : "FAIL"}</span>`;
}
async function runAll() {
  $("ck-status").textContent = "运行中…";
  $("ck-list").innerHTML = `<div class="card text-sm text-slate-500">正在执行判据 (mini-run 需数分钟, 真机)…</div>`;
  const model = $("ck-model").value;
  const ebr = $("ck-ebr").value.trim();
  const std = $("ck-std").value.trim();
  const params = new URLSearchParams({ model });
  if (ebr) params.set("ebr", ebr);
  if (std) params.set("error_std", std);
  try {
    const r = await j(await fetch(`/api/checks/all?${params}`));
    $("ck-list").innerHTML = r.checks.map((c) => `
      <div class="card ${c.pass ? "ck-pass" : "ck-fail"}">
        <div class="flex items-center gap-2">
          <span class="font-bold">${c.name}</span>
          ${badge(c.pass, c.value)}
          <span class="text-xs ml-auto">${c.value || ""}</span>
        </div>
        <div class="text-[11px] text-slate-400 mt-1">${c.detail}</div>
      </div>`).join("");
    const sop = $("ck-sop");
    sop.classList.remove("hidden");
    sop.innerHTML = `<div class="text-gold mb-1">SOP 纪律提醒:</div>` +
      (r.sop_hint || []).map((h) => `<div>· ${h}</div>`).join("");
    $("ck-status").innerHTML = r.all_pass
      ? `<span class="text-emerald-400 font-bold">✓ 四项全部达标 — 可开窗</span>`
      : `<span class="text-red-400 font-bold">✗ 存在未达标项 — 禁止开窗</span>`;
  } catch (e) {
    $("ck-list").innerHTML = `<div class="card ck-fail">判据执行失败: ${e.message}</div>`;
    $("ck-status").textContent = "";
  }
}
$("ck-run").onclick = runAll;
</script>
</body>
</html>
